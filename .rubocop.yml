AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

plugins:
  - rubocop-rake
  - rubocop-thread_safety
  - rubocop-capybara

ThreadSafety/NewThread:
  Enabled: false

ThreadSafety/ClassInstanceVariable:
  Enabled: false

Capybara:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 20

Metrics/BlockLength:
  Max: 30
  Exclude:
    - "spec/**/*"
    - "Rakefile"
